[package]
name = "provenix-attest"
version = "0.1.0"
edition = "2021"
description = "Signing and remote attestation tools for Provenix (pxa)"

[[bin]]
name = "pxa"
path = "src/main.rs"

[lib]
name = "provenix_attest"
path = "src/lib.rs"

[dependencies]
provenix-corelib = { path = "../corelib" }
provenix-utils = { path = "../utils" }