[workspace]
resolver = "2"
members = [
    "provenix-core",
    "provenix-plugin",
    "provenix-sbom",
    "provenix-attest",
    "provenix-sign",
    "provenix-verify",
    "provenix-cli",
    "provenix-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Provenix Team"]
license = "Apache-2.0"
repository = "https://github.com/your-org/provenix"
description = "Software supply chain security and provenance platform"

[workspace.dependencies]
# Common dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
