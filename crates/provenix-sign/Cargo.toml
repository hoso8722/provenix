[package]
name = "provenix-sign"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "provenix_sign"
path = "src/lib.rs"

[[bin]]
name = "pxs"
path = "src/main.rs"

[[bin]]
name = "provenix-keygen"
path = "src/keygen.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
env_logger = "0.11"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Internal dependencies
provenix-core = { path = "../provenix-core" }
provenix-plugin = { path = "../provenix-plugin" }
provenix-utils = { path = "../provenix-utils" }

# External dependencies
ctor = "0.2"

# Phase 2: Cryptographic signing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"

# crate-specific deps
[target.'cfg(unix)'.dependencies]
# add platform specific if needed
