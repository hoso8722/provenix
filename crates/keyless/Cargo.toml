[package]
name = "provenix-keyless"
version = "0.1.0"
edition = "2021"

[dependencies]
provenix-plugin = { path = "../provenix-plugin" }
provenix-core = { path = "../provenix-core" }
provenix-utils = { path = "../provenix-utils" }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ed25519-dalek = "2.1"
rand = "0.8"
reqwest = { version = "0.11", features = [
  "json",
  "rustls-tls",
], default-features = false }
tokio = { workspace = true }
ctor = "0.2"

# Phase 4.1: X.509 certificate verification
x509-parser = "0.16"
pem = "3.0"
ring = "0.17"

[dev-dependencies]
tokio-test = "0.4"
