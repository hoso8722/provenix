[package]
name = "provenix-utils"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }

# Phase 3: Rekor client
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"

# Phase 4: Fulcio client
ed25519-dalek = "2.1"
rand = "0.8"

# Phase 4.1: X.509 certificate utilities
x509-parser = "0.16"
pem = "3.0"
ring = "0.17"

# Phase 4.2: JWT signature verification
jsonwebtoken = "9.3"

# crate-specific deps
[target.'cfg(unix)'.dependencies]
# add platform specific if needed
